services:
  study-tutor:
    build: .
    container_name: study-tutor
    ports:
      - "8501:8501"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/api/chat}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      HF_HOME: /home/study-tutor/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - huggingface_cache:/home/study-tutor/.cache/huggingface
    restart: unless-stopped

volumes:
  huggingface_cache:
